name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Opus
        run: sudo apt-get update && sudo apt-get install -y libopus-dev
      - name: Configure host checks
        run: cmake -S . -B build-host -DVOICECHAT_BUILD_HOST_INTEGRATION=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Compile lifecycle and simulated-device integration
        run: cmake --build build-host --target voicechat_mod_compile_check voicechat_mod_integration_test -j 2
      - name: Run host tests
        run: PRELOADER_INC="$PWD/build-host/_deps/preloader_android-src/include" sh tests/run_host_tests.sh
      - name: Exercise actual mod startup and both microphones against the relay
        run: python3 tests/voice_mod_integration.py build-host/voicechat_mod_integration_test

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The GitHub runner image already ships the Android SDK, so we skip
      # android-actions/setup-android (it broke on the new cmdline-tools).
      - name: Install Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "Using $SDKMANAGER (ANDROID_HOME=$ANDROID_HOME)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build packages
        shell: pwsh
        run: ./scripts/package.ps1 -Abi arm64-v8a

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voicechat-levipack
          path: build-*/*.levipack
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-*/*.levipack
